name: Release Flying Thumb
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install build tools
        run: python -m pip install platformio esptool pyinstaller
      - name: Build recovery flasher
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --name FlyingThumbEsptool --distpath work/esptool tools/flying_thumb_esptool.py
      - name: Build release assets
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            release/FlyingThumbManager.exe
            release/FlyingThumbManager-Windows.zip
            release/FlyingThumb-v2-wifi-update.bin
            release/FlyingThumb-v2-full.bin
            release/latest.json
