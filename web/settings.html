<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flying Thumb Setup</title>
<style>
body{font:16px system-ui;max-width:520px;margin:auto;padding:24px;color:#18212b}
label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;font-size:16px}
button{margin-top:20px;padding:12px 18px;background:#075985;color:white;border:0;border-radius:6px}.note{color:#52606d}
[hidden]{display:none!important}
</style>
</head>
<body>
<a href="/">← Files</a>
<h1 id="heading">Set up Flying Thumb</h1>
<label>Machine name</label><input id="machineName" placeholder="LongArm-1" autocomplete="off" maxlength="31">
<div id="wifiFields">
<label id="ssidLabel">Wi-Fi name</label><input id="ssid" autocomplete="off">
<label id="passwordLabel">Wi-Fi password</label><input id="password" type="password">
</div>
<label id="keyLabel">Shop management key</label><input id="key" type="password">
<div id="newKeyFields" hidden><label>New shop management key</label><input id="newKey" type="password" placeholder="Leave blank to keep the current key"></div>
<button id="saveButton" onclick="save()">Save and connect</button>
<p class="note" id="note">Use the same management key on all Flying Thumb Drives. Short-press starts WPS; hold five seconds to forget Wi-Fi.</p>
<p id="status"></p>
<script>
const machineNameInput=document.getElementById('machineName');
const ssidInput=document.getElementById('ssid');
const passwordInput=document.getElementById('password');
const keyInput=document.getElementById('key');
const newKeyInput=document.getElementById('newKey');
const headingElement=document.getElementById('heading');
const ssidLabelElement=document.getElementById('ssidLabel');
const passwordLabelElement=document.getElementById('passwordLabel');
const keyLabelElement=document.getElementById('keyLabel');
const newKeyFieldsElement=document.getElementById('newKeyFields');
const noteElement=document.getElementById('note');
const statusText=document.getElementById('status');
const saveButtonElement=document.getElementById('saveButton');
let setupMode=true; let machineNameEdited=false;
machineNameInput.addEventListener('input',()=>machineNameEdited=true);
async function load(){
  try{
    const r=await fetch('/api/device',{cache:'no-store'}); const d=await r.json();
    setupMode=!!d.setupMode; if(!machineNameEdited)machineNameInput.value=d.name||'';
    if(!setupMode){
      headingElement.textContent='Flying Thumb settings';
      ssidLabelElement.textContent='New Wi-Fi name';
      passwordLabelElement.textContent='New Wi-Fi password';
      ssidInput.placeholder='Leave blank to keep the current network';
      saveButtonElement.textContent='Save and restart';
      keyLabelElement.textContent=d.claimed?'Current shop management key':'Shop management key (optional)';
      newKeyFieldsElement.hidden=false;
      noteElement.textContent='Enter a new Wi-Fi name and password to move this drive to another network. Leave them blank to keep its current network.';
    }
  }catch(e){statusText.textContent='Could not read the current settings.';}
}
async function save(){
  statusText.textContent='Saving…'; saveButtonElement.disabled=true;
  try{
    const headers={'Content-Type':'application/json'};
    let url='/api/setup';
    let body={name:machineNameInput.value,ssid:ssidInput.value,password:passwordInput.value,key:keyInput.value};
    if(!setupMode){headers['X-FlyingThumb-Key']=keyInput.value;body={name:machineNameInput.value,ssid:ssidInput.value,password:passwordInput.value,key:newKeyInput.value||keyInput.value};}
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({error:'The drive did not accept the change.'}));
    statusText.textContent=r.ok?'Saved. Flying Thumb is restarting.':(d.error||'The change could not be saved.');
  }catch(e){statusText.textContent='Could not reach Flying Thumb.';}
  finally{saveButtonElement.disabled=false;}
}
load();
</script>
</body>
</html>
