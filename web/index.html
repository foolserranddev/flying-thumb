<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Flying Thumb</title><style>body{font:16px system-ui;max-width:800px;margin:auto;padding:24px;color:#18212b}header{display:flex;justify-content:space-between;align-items:center}a,button{color:#075985}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}button,input{padding:8px}#disk,.note{color:#52606d}.panel{padding:18px;background:#eef7ff;border-radius:10px;margin:14px 0}</style></head><body><header><h1>Flying Thumb</h1><a href="/settings.html">Device setup</a></header><p id="disk">Reading storage…</p><div class="panel"><label>Management key <input id="key" type="password"></label><button onclick="remember()">Remember</button></div><div class="panel"><input id="file" type="file"><button onclick="upload()">Upload</button><span class="note"> The drive reconnects after a change.</span></div><table><thead><tr><th>Name</th><th>Size</th><th></th></tr></thead><tbody id="files"></tbody></table><script>
key.value=localStorage.ftkey||'';const headers=()=>({'X-FlyingThumb-Key':key.value});const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(1)+' GB';function remember(){localStorage.ftkey=key.value;alert('Saved in this browser.')}async function load(){let d=await(await fetch('/api/disk')).json();disk.textContent=`${fmt(d.used)} used · ${fmt(d.free)} free`;let list=await(await fetch('/api/list?dir=/')).json();files.innerHTML=list.map(x=>`<tr><td><a href="${encodeURI(x.name)}">${x.name.replace(/^\//,'')}</a></td><td>${fmt(x.size)}</td><td><button onclick="del('${x.name.replaceAll("'","\\'")}')">Delete</button></td></tr>`).join('')}async function upload(){let f=file.files[0];if(!f)return alert('Choose a file first.');let body=new FormData();body.append('file',f,f.name);let r=await fetch('/upload',{method:'POST',headers:headers(),body});if(r.status===401)return alert('Wrong management key.');document.body.innerHTML='<h1>Uploaded</h1><p>Flying Thumb is reconnecting. Reload shortly.</p>'}async function del(name){if(!confirm(`Delete ${name}?`))return;let r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({dir:name})});if(r.status===401)return alert('Wrong management key.');document.body.innerHTML='<h1>Deleted</h1><p>Flying Thumb is reconnecting. Reload shortly.</p>'}load();</script></body></html>
